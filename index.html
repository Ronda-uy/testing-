<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ronda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#00312E;
    --ink-2:#0B433D;
    --ink-3:#124F48;
    --forest:#25611E;
    --lime:#BCED07;
    --lime-dim:#96B406;
    --lime-glow:rgba(188,237,7,0.35);
    --amber:#F5C344;
    --mint:#EEFDE6;
    --mint-dim:#D7ECDA;
    --coral:#FF6452;
    --coral-dim:#E14A38;
    --text-dark-sec:#9FC7BE;
    --text-light-sec:#4C6B64;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 24px 60px -24px rgba(0,0,0,0.6), 0 10px 24px -12px rgba(0,0,0,0.4);
    --shadow-soft: 0 14px 34px -18px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(188,237,7,0.08), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(37,97,30,0.35), transparent 55%),
      var(--ink);
    color:var(--mint);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Syne', sans-serif; font-weight:800; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a,button{ font-family:inherit; }
  button{ cursor:pointer; border:none; background:none; }
  label{ display:block; }

  .nav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding:14px 28px;
    background:rgba(0,49,46,0.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(238,253,230,0.08);
    box-shadow:0 12px 30px -18px rgba(0,0,0,0.6);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:38px; height:38px; border-radius:11px; display:block; box-shadow:0 0 0 1px rgba(238,253,230,0.12), 0 8px 20px -6px var(--lime-glow); }
  .brand .word{ font-size:21px; line-height:1; }
  .brand .tag{ font-size:11px; color:var(--text-dark-sec); margin-top:3px; }
  .nav-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:8px 14px; border-radius:999px; background:rgba(238,253,230,0.06); border:1px solid rgba(238,253,230,0.12); color:var(--mint); }
  .pill-btn{ transition:transform .15s ease, background .15s ease; }
  .pill-btn:hover{ transform:translateY(-1px); }
  .pill-lime{ background:var(--lime); color:var(--ink); border-color:var(--lime); font-weight:700; }
  .pill-ghost{ background:transparent; border:1px solid rgba(238,253,230,0.18); color:var(--text-dark-sec); }

  main{ max-width:1080px; margin:0 auto; padding:36px 24px 80px; }
  .wizard-wrap{ max-width:600px; margin:0 auto; }

  .progress{ display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .progress .seg{ display:flex; align-items:center; gap:6px; flex:1; }
  .dot{ width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; border:1px solid rgba(238,253,230,0.25); color:var(--text-dark-sec); }
  .dot.on{ background:var(--lime); color:var(--ink); border-color:var(--lime); }
  .line{ height:1px; flex:1; background:rgba(238,253,230,0.18); }
  .line.on{ background:var(--lime); }
  .step-label{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--lime); font-weight:700; margin-bottom:22px; }

  .card{ background:var(--mint); color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }
  .card + .card{ margin-top:18px; }
  h2.title{ font-size:25px; margin:0 0 6px; }
  p.sub{ font-size:14px; color:var(--text-light-sec); margin:0 0 20px; line-height:1.5; }

  .opt{ background:#fff; color:var(--ink); border:1.5px solid var(--mint-dim); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; }
  .opt[open]{ border-color:var(--lime-dim); box-shadow:0 0 0 3px rgba(188,237,7,0.15); }
  .opt.selected{ border-color:var(--lime-dim); background:#F7FFEB; }
  .opt summary{ list-style:none; cursor:pointer; padding:16px 18px; display:flex; align-items:flex-start; gap:12px; }
  .opt summary::-webkit-details-marker{ display:none; }
  .opt-icon{ width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--mint); color:var(--text-light-sec); font-weight:700; }
  .opt-title{ font-weight:700; font-size:14.5px; flex:1; }
  .opt-sub{ font-size:12.5px; color:var(--text-light-sec); margin-top:3px; line-height:1.4; }
  .chev{ margin-left:auto; color:var(--text-light-sec); transition:transform .2s ease; flex-shrink:0; }
  .opt[open] .chev{ transform:rotate(180deg); }
  .opt-detail{ padding:0 18px 16px 64px; font-size:12.5px; color:var(--text-light-sec); line-height:1.5; }
  .radio{ width:34px;height:34px;border-radius:50%;flex-shrink:0; display:flex;align-items:center;justify-content:center; background:var(--mint); border:1.5px solid var(--mint-dim); }
  .radio.on{ background:var(--ink); border-color:var(--ink); }
  .radio.on::after{ content:''; width:9px; height:9px; border-radius:50%; background:var(--lime); }

  textarea, input[type=text]{ width:100%; border-radius:var(--radius-sm); border:1.5px solid var(--mint-dim); background:#fff; color:var(--ink); padding:14px 16px; font-size:14px; font-family:inherit; }
  textarea{ min-height:100px; resize:vertical; }
  textarea:focus, input:focus{ outline:none; border-color:var(--lime-dim); box-shadow:0 0 0 3px rgba(188,237,7,0.18); }
  .field-label{ font-size:11px; font-weight:700; color:var(--text-light-sec); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:999px; font-weight:700; font-size:14px; transition:transform .15s ease, opacity .15s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{ background:var(--ink); color:var(--mint); }
  .btn-primary[disabled]{ opacity:.35; pointer-events:none; }
  .btn-ghost{ color:var(--text-light-sec); }
  .btn-block{ width:100%; }
  .wizard-nav{ display:flex; justify-content:space-between; margin-top:22px; }

  .emp-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; color:var(--ink); border:1px solid var(--mint-dim); border-radius:var(--radius-sm); margin-bottom:8px;}
  .avatar{ width:32px;height:32px;border-radius:50%; background:var(--lime); color:var(--ink); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
  .emp-name{ font-weight:700; font-size:14px; }
  .emp-role{ font-size:11.5px; color:var(--text-light-sec); }
  .add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .add-row input{ flex:1; }

  .summary-row{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:9px 0; border-bottom:1px dashed var(--mint-dim); gap:10px; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row span:first-child{ color:var(--text-light-sec); flex-shrink:0; }
  .summary-row b{ font-weight:700; text-align:right; }
  .summary-row input{ text-align:right; border:none; background:transparent; font-weight:700; padding:0; width:auto; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px; }
  .stat-card{ background:var(--mint); color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-soft); padding:20px; }
  .stat-label{ display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--text-light-sec); margin-bottom:10px; }
  .stat-value{ font-size:21px; color:var(--ink); }
  .stat-sub{ font-size:11.5px; color:var(--text-light-sec); margin-top:3px; }
  .tone-coral{ color:var(--coral-dim); }
  .tone-lime{ color:var(--forest); }

  .alert-card{ background:var(--mint); color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-soft); padding:16px 20px; border-left:5px solid var(--coral); margin-bottom:18px; }
  .alert-line{ font-size:13px; padding:5px 0; line-height:1.5; }

  .dash-grid{ display:grid; grid-template-columns:1fr 270px; gap:18px; }
  @media (max-width:820px){ .dash-grid{ grid-template-columns:1fr; } .stat-grid{ grid-template-columns:1fr; } }

  .grid-card{ background:var(--mint); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:center; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-light-sec); padding:16px 6px 10px; font-weight:700; }
  thead th:first-child{ text-align:left; padding-left:20px; }
  tbody td{ padding:6px; }
  tbody td:first-child{ padding-left:20px; padding-right:6px; }
  .emp-cell-name{ font-weight:700; font-size:13.5px; white-space:nowrap; }
  .emp-cell-role{ font-size:10.5px; color:var(--text-light-sec); font-weight:500; }
  .cell-btn{ width:100%; border-radius:10px; border:1.5px solid var(--mint-dim); font-size:10.5px; font-weight:700; padding:10px 4px; text-align:center; transition:transform .1s ease; }
  .cell-btn:hover{ transform:scale(1.04); }
  .cell-manana{ background:rgba(188,237,7,0.22); border-color:var(--lime-dim); color:var(--ink); }
  .cell-asignado{ background:rgba(188,237,7,0.22); border-color:var(--lime-dim); color:var(--ink); }
  .cell-tarde{ background:var(--ink); border-color:var(--ink); color:var(--mint); }
  .cell-franco{ background:transparent; border-style:dashed; border-color:var(--forest); color:var(--forest); }
  .cell-empty{ background:transparent; border-style:dashed; color:var(--text-light-sec); }
  .legend{ display:flex; flex-wrap:wrap; gap:16px; padding:14px 20px; border-top:1px solid var(--mint-dim); font-size:11px; color:var(--text-light-sec); }
  .legend-swatch{ width:12px; height:12px; border-radius:4px; display:inline-block; margin-right:6px; vertical-align:-2px; }

  .side-card{ background:var(--ink-2); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; height:fit-content; }
  .side-title{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--text-dark-sec); margin-bottom:12px; }
  .status-item{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 12px; border-radius:10px; background:rgba(238,253,230,0.05); margin-bottom:6px; text-align:left; }
  .status-name{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mint); }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .status-label{ font-size:10px; }

  .accordion-card{ background:var(--mint); color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-soft); padding:8px 20px; margin-top:18px; }
  .accordion-card h3{ font-size:14px; padding:14px 0 4px; margin:0; }
  details.acc{ border-top:1px solid var(--mint-dim); }
  details.acc:last-child{ padding-bottom:6px; }
  details.acc summary{ list-style:none; cursor:pointer; padding:14px 0; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:13.5px; gap:10px; }
  details.acc summary::-webkit-details-marker{ display:none; }
  details.acc[open] summary{ color:var(--forest); }
  details.acc .acc-body{ font-size:13px; color:var(--text-light-sec); line-height:1.6; padding-bottom:14px; }
  details.acc .chev{ transition:transform .2s ease; flex-shrink:0; }
  details.acc[open] .chev{ transform:rotate(180deg); }

  .footer-note{ text-align:center; font-size:11px; color:var(--text-dark-sec); margin-top:26px; }

  /* Employee side */
  .greet{ font-size:24px; margin-bottom:2px; }
  .week-strip{ display:flex; gap:6px; margin:16px 0 4px; }
  .strip-pill{ flex:1; text-align:center; padding:10px 2px; border-radius:10px; font-size:10px; font-weight:800; }
  .strip-day{ font-size:8.5px; opacity:.65; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
  .status-toggle{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .status-btn{ flex:1; min-width:110px; padding:14px 10px; border-radius:12px; border:1.5px solid var(--mint-dim); background:#fff; font-weight:700; font-size:12.5px; text-align:center; color:var(--ink); }
  .status-btn.active{ border-color:var(--ink); background:var(--ink); color:var(--mint); }
  .libre-banner{ background:rgba(188,237,7,0.2); border:1.5px dashed var(--lime-dim); border-radius:var(--radius-sm); padding:20px; text-align:center; font-weight:700; color:var(--forest); font-size:15px; }
  .link-quiet{ font-size:12.5px; color:var(--text-light-sec); text-decoration:underline; margin-top:16px; display:inline-block; }

  /* Multi-sucursal / historial / ausencias */
  .local-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .local-tab{ padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:700; border:1.5px solid var(--mint-dim); background:var(--mint); color:var(--text-light-sec); }
  .local-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--mint); }
  .local-tab.add{ border-style:dashed; color:var(--forest); background:transparent; }

  .cell-select{ width:100%; border-radius:10px; border:1.5px solid var(--mint-dim); font-size:9.5px; font-weight:700; padding:9px 2px; text-align:center; text-align-last:center; -webkit-appearance:none; appearance:none; }

  .new-local-form{ background:#fff; color:var(--ink); border:1.5px dashed var(--lime-dim); border-radius:var(--radius-sm); padding:18px; margin-top:14px; }

  .pending-card{ background:#fff; color:var(--ink); border:1.5px solid var(--mint-dim); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px; }
  .pending-thumb{ max-width:160px; border-radius:10px; margin:8px 0; display:block; }
  .badge{ font-size:10px; font-weight:800; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; display:inline-block; }
  .badge-pendiente{ background:rgba(245,195,68,0.3); color:#7A5C0A; }
  .badge-aprobado{ background:rgba(188,237,7,0.3); color:var(--forest); }
  .badge-rechazado{ background:rgba(255,100,82,0.22); color:var(--coral-dim); }
  .history-line{ font-size:11.5px; color:var(--text-light-sec); margin-top:6px; line-height:1.6; }
  input[type=file]{ font-size:12.5px; }
  input[type=date]{ width:100%; border-radius:var(--radius-sm); border:1.5px solid var(--mint-dim); background:#fff; color:var(--ink); padding:12px 14px; font-size:14px; font-family:inherit; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vzihlzoqnqowqidxvuth.supabase.co";
const SUPABASE_KEY = "sb_publishable_u49hetpJhEM5BvBOsYcbhA_KRpC-IH4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

const RUBROS = {
  comercio: { label:"Comercio", descanso:36, maxHoras:44, nota:"Régimen general de comercio y servicios.",
    detalle:"El descanso semanal mínimo para comercio es de 36 horas consecutivas (Ley 7.318 y Decreto 437/88). La jornada máxima diaria es de 8 horas y el máximo semanal es de 44 horas." },
  gastronomia: { label:"Gastronomía", descanso:36, maxHoras:44, nota:"Base de comercio — revisá con tu contador las cláusulas propias del convenio gastronómico.",
    detalle:"Usa la misma base legal que comercio (36h de descanso, 44h semanales), pero el convenio colectivo del sector puede agregar condiciones particulares." },
  industria: { label:"Industria", descanso:24, maxHoras:48, nota:"Régimen general industrial.",
    detalle:"El descanso semanal mínimo para industria es de 24 horas consecutivas. La jornada máxima diaria es de 8 horas y el máximo semanal es de 48 horas." },
};
const DAYS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const STEP_LABELS = ["Negocio","Sucursales","Equipo","Confirmar"];

function freshState(){
  return {
    role:"admin", empresaId:null, empresaName:"",
    locales:[], activeLocalId:null,
    employeeSession:null,
    view:"wizard", step:0,
    employees:[], turnos:{}, clockStatus:{}, statusHistory:{},
    ausenciasPendientes:[], misAusencias:[],
    addingLocal:false, newLocalDraft:null,
    reportandoFalta:false, nuevaAusencia:null,
    horarioDraft:null,
    confirmando:null,
    error:null, saving:false,
  };
}
let state = freshState();
let loaded = false;

function getEmpresaIdFromUrl(){ return new URLSearchParams(window.location.search).get("empresa"); }
function setEmpresaIdInUrl(id){ const url = new URL(window.location); url.searchParams.set("empresa", id); window.history.replaceState({}, "", url); }

async function loadState(){
 try{
  const empresaId = getEmpresaIdFromUrl();
  if(empresaId){
    const { data: empresaRow, error: e1 } = await sb.from("empresas").select("*").eq("id", empresaId).single();
    if(!e1 && empresaRow){
      const { data: locs } = await sb.from("locales").select("*").eq("empresa_id", empresaId).order("created_at");
      const { data: emps } = await sb.from("empleados").select("*").eq("empresa_id", empresaId).order("created_at");
      const empIds = (emps||[]).map(e=>e.id);
      let turnosRows = [];
      if(empIds.length){ const { data: t } = await sb.from("turnos").select("*").in("empleado_id", empIds); turnosRows = t||[]; }
      let logRows = [];
      if(empIds.length){
        const now = new Date();
        const dow = (now.getDay()+6)%7;
        const monday = new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);
        const { data: l } = await sb.from("estados_log").select("*").in("empleado_id", empIds).gte("created_at", monday.toISOString()).order("created_at",{ascending:true});
        logRows = l||[];
      }
      let pendRows = [];
      if(empIds.length){
        const { data: p } = await sb.from("ausencias").select("*").in("empleado_id", empIds).eq("estado_revision","pendiente").order("created_at",{ascending:false});
        pendRows = p||[];
      }
      state.empresaId = empresaId;
      state.empresaName = empresaRow.nombre;
      state.locales = locs||[];
      state.activeLocalId = (locs&&locs[0]) ? locs[0].id : null;
      state.employees = (emps||[]).map(row=>({id:row.id, name:row.nombre, role:row.rol||"Sin definir"}));
      state.turnos = {}; state.clockStatus = {}; state.statusHistory = {};
      (emps||[]).forEach(row=>{ state.turnos[row.id]=Array(7).fill(null); state.clockStatus[row.id]=row.estado||"afuera"; state.statusHistory[row.id]=[]; });
      turnosRows.forEach(t=>{ if(state.turnos[t.empleado_id]) state.turnos[t.empleado_id][t.dia] = {tipo:t.tipo, localId:t.local_id}; });
      logRows.forEach(l=>{ if(state.statusHistory[l.empleado_id]) state.statusHistory[l.empleado_id].push({estado:l.estado, created_at:l.created_at}); });
      state.ausenciasPendientes = (pendRows||[]).map(p=>{ const emp = (emps||[]).find(e=>e.id===p.empleado_id); return {...p, empleadoNombre: emp?emp.nombre:"—"}; });
      state.view = "dashboard";
    } else {
      state.error = "No encontramos ese negocio — revisá el link o creá uno nuevo.";
    }
  }
 } catch(err){
  state.error = "No se pudo cargar: " + ((err && err.message) ? err.message : "error desconocido");
 } finally {
  loaded = true;
  render();
 }
}

const PRESETS_TURNO = {
  partido: { label:"Turno partido (Mañana y Tarde)", turnos:[
    {nombre:"Mañana", duracionHoras:8, personasSemana:1, personasFinde:1},
    {nombre:"Tarde", duracionHoras:8, personasSemana:1, personasFinde:1},
  ]},
  completo: { label:"Turno completo (un solo turno)", turnos:[
    {nombre:"Turno único", duracionHoras:8, personasSemana:1, personasFinde:1},
  ]},
  triple: { label:"Mañana, Tarde y Noche", turnos:[
    {nombre:"Mañana", duracionHoras:8, personasSemana:1, personasFinde:1},
    {nombre:"Tarde", duracionHoras:8, personasSemana:1, personasFinde:1},
    {nombre:"Noche", duracionHoras:8, personasSemana:1, personasFinde:1},
  ]},
  cuatro: { label:"Dividido en 4 turnos", turnos:[
    {nombre:"Turno 1", duracionHoras:6, personasSemana:1, personasFinde:1},
    {nombre:"Turno 2", duracionHoras:6, personasSemana:1, personasFinde:1},
    {nombre:"Turno 3", duracionHoras:6, personasSemana:1, personasFinde:1},
    {nombre:"Turno 4", duracionHoras:6, personasSemana:1, personasFinde:1},
  ]},
};
function nuevoId(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID() : ("t"+Date.now()+Math.random().toString(16).slice(2)); }
function findTurno(localId, turnoId){
  const loc = state.locales.find(l=>l.id===localId);
  if(!loc) return null;
  return (loc.config.turnos||[]).find(t=>t.id===turnoId) || null;
}

function rulesForConfig(config){
  if(!config) return { label:"Sin definir", descanso:0, maxHoras:0 };
  if(config.rubro==="personalizado"){
    return { label:"Personalizado", descanso:Number(config.descansoCustom)||0, maxHoras:Number(config.maxHorasCustom)||0 };
  }
  const r = RUBROS[config.rubro || "comercio"];
  return r ? { label:r.label, descanso:r.descanso, maxHoras:r.maxHoras } : { label:"Sin definir", descanso:0, maxHoras:0 };
}
function primaryLocalId(empId){
  const days = state.turnos[empId]||[];
  const counts = {};
  days.forEach(d=>{ if(d && d.localId){ counts[d.localId]=(counts[d.localId]||0)+1; } });
  let best=null, bestN=0;
  Object.entries(counts).forEach(([id,n])=>{ if(n>bestN){ best=id; bestN=n; } });
  return best || (state.locales[0] ? state.locales[0].id : null);
}
function employeeRules(empId){
  const lid = primaryLocalId(empId);
  const loc = state.locales.find(l=>l.id===lid);
  return loc ? rulesForConfig(loc.config) : { label:"Sin local", descanso:0, maxHoras:0 };
}
function localName(id){ const l = state.locales.find(l=>l.id===id); return l?l.nombre:"—"; }

function update(patch){ Object.assign(state, patch); render(); }

function canAdvance(){
  const s = state.step;
  if(s===0) return !!(state.empresaName && state.empresaName.trim());
  if(s===1) return state.locales.length>0;
  if(s===2) return state.employees.length>0;
  return true;
}
function goStep(delta){ update({ step: Math.max(0, state.step+delta) }); }
function goStepTo(n){ if(n<=state.step || canAdvance()) update({ step:n }); }

async function activarPanel(){
  state.saving = true; state.error=null; render();
  try{
    if(!state.empresaId){
      const { data: emp, error: e1 } = await sb.from("empresas").insert({ nombre: state.empresaName }).select().single();
      if(e1) throw new Error("No se pudo crear el negocio: "+e1.message);
      const newLocales = [];
      for(const loc of state.locales){
        const { data: ld, error: le } = await sb.from("locales").insert({ empresa_id:emp.id, nombre:loc.nombre, config:loc.config }).select().single();
        if(le) throw new Error("No se pudo crear la sucursal '"+loc.nombre+"': "+le.message);
        newLocales.push(ld);
      }
      const newEmployees=[], newTurnos={}, newStatus={};
      for(const e of state.employees){
        const { data: ed, error: ee } = await sb.from("empleados").insert({ empresa_id:emp.id, nombre:e.name, rol:e.role, estado:"afuera" }).select().single();
        if(ee) throw new Error("No se pudo agregar a "+e.name+": "+ee.message);
        newEmployees.push({id:ed.id,name:ed.nombre,role:ed.rol}); newTurnos[ed.id]=Array(7).fill(null); newStatus[ed.id]="afuera";
      }
      state.empresaId=emp.id; state.empresaName=emp.nombre;
      state.locales=newLocales; state.activeLocalId = newLocales[0]?newLocales[0].id:null;
      state.employees=newEmployees; state.turnos=newTurnos; state.clockStatus=newStatus; state.statusHistory={};
      setEmpresaIdInUrl(emp.id);
    } else {
      const { error } = await sb.from("empresas").update({ nombre: state.empresaName }).eq("id", state.empresaId);
      if(error) throw new Error("No se pudo guardar: "+error.message);
    }
    state.view="dashboard";
  } catch(err){
    state.error = (err && err.message) ? err.message : "Ocurrió un error inesperado al activar el panel.";
  } finally {
    state.saving=false; render();
  }
}

function switchRole(r){ state.role=r; if(r==="admin" && state.empresaId) state.view="dashboard"; render(); }
function resetAll(){
  const url = new URL(window.location); url.searchParams.delete("empresa"); window.history.replaceState({}, "", url);
  state = freshState(); render();
}
function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    const btn = document.getElementById("copyLinkBtn");
    if(btn){ const orig = btn.textContent; btn.textContent="¡Copiado!"; setTimeout(()=>{ btn.textContent=orig; }, 1500); }
  });
}
function todayIndex(){ return (new Date().getDay()+6)%7; }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}); }

/* ---- Sucursales ---- */
function selectLocalTab(id){ state.activeLocalId=id; render(); }
function startAddLocal(){ state.addingLocal=true; state.newLocalDraft={ nombre:"", rubro:null, descansoTipo:null, jornadaTipo:null, mediaHora:null, descansoCustom:"", maxHorasCustom:"", turnos:[] }; render(); }
function aplicarPreset(key){

function todaysLog(empId){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  return (state.statusHistory[empId]||[]).filter(h=> new Date(h.created_at) >= startOfDay).sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
}
function todayFlowState(empId){
  const log = todaysLog(empId);
  if(!log.length) return { fase:"sin_marcar" };
  const last = log[log.length-1];
  if(last.estado==="local") return { fase:"trabajando", desde:last.created_at };
  if(last.estado==="descanso") return { fase:"en_descanso", desde:last.created_at };
  if(last.estado==="afuera") return { fase:"finalizado", hora:last.created_at };
  return { fase:"sin_marcar" };
}

function statsFor(empId){
  const r = employeeRules(empId);
  const days = state.turnos[empId]||Array(7).fill(null);
  let horas = 0, turnos = 0;
  days.forEach(d=>{
    if(d && d.tipo!=="franco"){
      const t = findTurno(d.localId, d.tipo);
      horas += t ? Number(t.duracionHoras) : 8;
      turnos++;
    }
  });
  const hasFranco = days.some(d=>d && d.tipo==="franco");
  const francoIdx = days.findIndex(d=>d && d.tipo==="franco");
  const violations=[];
  if(!hasFranco) violations.push(`todavía no tuvo su descanso semanal (mínimo ${r.descanso}h)`);
  if(r.maxHoras>0 && horas > r.maxHoras) violations.push(`se pasó ${horas-r.maxHoras}h del máximo semanal (lleva ${horas}h de ${r.maxHoras}h)`);
  return { turnos, horas, hasFranco, francoIdx, violations, r };
}
function statusMeta(empId){
  const todayEntry = (state.turnos[empId]||[])[todayIndex()];
  if(todayEntry && todayEntry.tipo==="franco") return { text:"Día libre", color:"transparent", outline:true };
  const flow = todayFlowState(empId);
  if(flow.fase==="finalizado") return { text:"Salida "+fmtTime(flow.hora), color:"var(--text-dark-sec)", dim:true };
  if(flow.fase==="en_descanso") return { text:"En su descanso", color:"var(--amber)" };
  if(flow.fase==="trabajando") return { text:"En el local desde "+fmtTime(flow.desde), color:"var(--lime)" };
  return { text:"Sin marcar todavía", color:"var(--text-dark-sec)", dim:true };
}

/* ---- Reportes: horas reales fichadas vs planificadas ---- */
function computeWorkedMs(empId){
  const log = (state.statusHistory[empId]||[]).slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  let workedMs=0, restMs=0, curStart=null, curType=null;
  log.forEach(entry=>{
    const t = new Date(entry.created_at).getTime();
    if(curStart!=null){
      const delta = t-curStart;
      if(curType==="local") workedMs+=delta;
      if(curType==="descanso") restMs+=delta;
    }
    curStart=t; curType=entry.estado;
  });
  if(curStart!=null){
    const delta = Date.now()-curStart;
    if(curType==="local") workedMs+=delta;
    if(curType==="descanso") restMs+=delta;
  }
  return { workedH: Math.round((workedMs/3600000)*10)/10, restH: Math.round((restMs/3600000)*10)/10 };
}

/* ---- Generación automática de horario (heurística simple) ---- */
function generarAutomatico(){
  if(!state.employees.length || !state.locales.length){ state.error="Necesitás al menos un empleado y una sucursal."; render(); return; }
  const hayTurnos = state.locales.some(l=> (l.config.turnos||[]).length>0);
  if(!hayTurnos){ state.error="Definí al menos un turno en alguna sucursal antes de generar (Reconfigurar → sucursal → Estructura de turnos)."; render(); return; }
  const emps = state.employees;
  const draft = {};
  emps.forEach(e=> draft[e.id]=Array(7).fill(null));
  // 1) A cada empleado le reservamos un día de franco, rotando para no dejar siempre el mismo día pelado de gente.
  emps.forEach((e,i)=>{ draft[e.id][i % 7] = {tipo:"franco", localId:null}; });
  // 2) Armamos los huecos a cubrir con los turnos reales de cada sucursal, respetando entre semana vs. fin de semana.
  let slots = [];
  state.locales.forEach(loc=>{
    (loc.config.turnos||[]).forEach(t=>{
      for(let d=0; d<7; d++){
        const esFinde = d>=5; // Sáb=5, Dom=6
        const necesarios = Math.max(1, Number(esFinde ? t.personasFinde : t.personasSemana) || 1);
        for(let i=0;i<necesarios;i++){
          slots.push({localId:loc.id, day:d, turnoId:t.id, horas: Number(t.duracionHoras)||8});
        }
      }
    });
  });
  slots.sort((a,b)=>a.day-b.day);
  const horas = {}; emps.forEach(e=>horas[e.id]=0);
  let ptr = 0;
  slots.forEach(slot=>{
    const loc = state.locales.find(l=>l.id===slot.localId);
    const r = rulesForConfig(loc.config);
    let tries=0;
    while(tries < emps.length){
      const cand = emps[ptr % emps.length]; ptr++; tries++;
      if(draft[cand.id][slot.day]) continue;
      if(r.maxHoras>0 && horas[cand.id]+slot.horas > r.maxHoras) continue;
      draft[cand.id][slot.day] = {tipo:slot.turnoId, localId:slot.localId};
      horas[cand.id]+=slot.horas;
      return;
    }
    // nadie disponible para este hueco — queda vacío, el encargado lo completa a mano
  });
  state.horarioDraft = draft;
  state.error=null;
  render();
}
function descartarDraft(){ state.horarioDraft=null; render(); }
async function confirmarDraft(){
  const draft = state.horarioDraft;
  if(!draft) return;
  state.saving=true; render();
  try{
    for(const emp of state.employees){
      for(let d=0; d<7; d++){
        const entry = draft[emp.id] ? draft[emp.id][d] : null;
        const prev = state.turnos[emp.id] ? state.turnos[emp.id][d] : null;
        if(JSON.stringify(entry)===JSON.stringify(prev)) continue;
        if(entry){
          const { error } = await sb.from("turnos").upsert({ empleado_id:emp.id, dia:d, tipo:entry.tipo, local_id:entry.localId||null }, { onConflict:"empleado_id,dia" });
          if(error) throw new Error("No se pudo guardar el turno de "+emp.name+": "+error.message);
        } else {
          const { error } = await sb.from("turnos").delete().eq("empleado_id", emp.id).eq("dia", d);
          if(error) throw new Error("No se pudo vaciar un turno de "+emp.name+": "+error.message);
        }
      }
    }
    state.turnos = draft;
    state.horarioDraft = null;
  } catch(err){
    state.error = err.message || "No se pudo confirmar el horario.";
  } finally {
    state.saving=false; render();
  }
}

function resizeImageToBase64(file, maxWidth, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxWidth/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  return `<div class="wizard-wrap">${renderProgress()}<div class="card">${body}</div>${nav}</div>`;
}

/* ---- Dashboard ---- */
function renderLocalTabs(){
  const tabs = state.locales.map(l=>`<button class="local-tab ${state.activeLocalId===l.id?'active':''}" onclick="selectLocalTab('${l.id}')">${l.nombre}</button>`).join("");
  return `<div class="local-tabs">${tabs}<button class="local-tab add" onclick="startAddLocal()">+ Agregar sucursal</button></div>`;
}
function renderCalendarControls(){
  if(state.horarioDraft){
    return `<div class="alert-card" style="border-left-color:var(--lime-dim); margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div><b>📋 Propuesta generada</b><div style="font-size:12.5px; color:var(--text-light-sec); margin-top:2px;">Revisala, corregí lo que haga falta tocando las celdas, y confirmá.</div></div>
        <div style="display:flex; gap:8px;">
          <button style="border:1.5px solid var(--mint-dim); border-radius:999px; padding:9px 16px; font-size:12.5px; font-weight:700; color:var(--text-light-sec);" onclick="descartarDraft()">Descartar</button>
          <button class="btn btn-primary" style="padding:9px 18px; font-size:12.5px;" ${state.saving?'disabled':''} onclick="confirmarDraft()">${state.saving?'Guardando…':'✅ Confirmar horario'}</button>

function renderNewLocalForm(){

  return `<div class="new-local-form">
    <div class="field-label">Nombre de la sucursal</div>

    ${Object.entries(RUBROS).map(([k,r])=>optRubro(k,r,d.rubro,"selectNewLocalRubro")).join("")}
    <div class="opt ${d.rubro==='personalizado'?'selected':''}"><summary onclick="event.preventDefault(); updateNewLocalDraft({rubro:'personalizado'});"><span class="radio ${d.rubro==='personalizado'?'on':''}"></span><span class="opt-title">Personalizado</span></summary>
      ${d.rubro==='personalizado' ? `<div style="padding:0 18px 18px 64px; display:flex; gap:10px; flex-wrap:wrap;">
        <div style="flex:1;min-width:140px;"><div class="field-label">Descanso (hs)</div><input id="inp-local-descanso-custom" type="text" inputmode="numeric" value="${d.descansoCustom}" oninput="updateNewLocalDraft({descansoCustom:this.value})"/></div>
        <div style="flex:1;min-width:140px;"><div class="field-label">Máx semanal (hs)</div><input id="inp-local-maxhoras-custom" type="text" inputmode="numeric" value="${d.maxHorasCustom}" oninput="updateNewLocalDraft({maxHorasCustom:this.value})"/></div>
      </div>`:""}
    </div>
    <div style="display:flex; gap:10px; margin:12px 0; flex-wrap:wrap;">
      <button class="status-btn ${d.descansoTipo==='fijo'?'active':''}" onclick="updateNewLocalDraft({descansoTipo:'fijo'})">Descanso fijo</button>
      <button class="status-btn ${d.descansoTipo==='rotativo'?'active':''}" onclick="updateNewLocalDraft({descansoTipo:'rotativo'})">Descanso rotativo</button>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="status-btn ${d.jornadaTipo==='continua'?'active':''}" onclick="updateNewLocalDraft({jornadaTipo:'continua'})">Jornada continua</button>
      <button class="status-btn ${d.jornadaTipo==='partida'?'active':''}" onclick="updateNewLocalDraft({jornadaTipo:'partida'})">Jornada partida</button>
    </div>
    ${d.jornadaTipo==='continua' ? `<div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="status-btn ${d.mediaHora==='fija'?'active':''}" onclick="updateNewLocalDraft({mediaHora:'fija'})">Media hora fija</button>
      <button class="status-btn ${d.mediaHora==='variable'?'active':''}" onclick="updateNewLocalDraft({mediaHora:'variable'})">Media hora variable</button>
    </div>`:""}
    <div style="margin-bottom:16px;">
      <div class="field-label">Estructura de turnos</div>
      <select id="inp-preset" onchange="aplicarPreset(this.value)" style="width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--mint-dim); background:#fff; color:var(--ink); font-size:14px; margin-bottom:12px;">
        <option value="">Elegí una forma típica...</option>
        ${Object.entries(PRESETS_TURNO).map(([k,p])=>`<option value="${k}">${p.label}</option>`).join("")}
      </select>
      ${(d.turnos&&d.turnos.length) ? `<div style="display:flex; gap:8px; font-size:10px; font-weight:700; color:var(--text-light-sec); padding:0 4px; margin-bottom:6px;">
        <span style="flex:2;">NOMBRE</span><span style="flex:1;">HORAS</span><span style="flex:1;">SEMANA</span><span style="flex:1;">FINDE</span><span style="width:22px;"></span>
      </div>`:""}
      ${(d.turnos||[]).map(t=>`<div style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; background:#F7FFEB; padding:8px; border-radius:10px;">
        <input id="turno-nombre-${t.id}" type="text" value="${t.nombre}" oninput="updateTurnoRow('${t.id}',{nombre:this.value})" style="flex:2; min-width:90px; padding:8px 10px;" placeholder="Nombre"/>
        <input id="turno-horas-${t.id}" type="text" inputmode="numeric" value="${t.duracionHoras}" oninput="updateTurnoRow('${t.id}',{duracionHoras:this.value})" style="flex:1; min-width:50px; padding:8px 10px;" placeholder="Hs"/>
        <input id="turno-semana-${t.id}" type="text" inputmode="numeric" value="${t.personasSemana}" oninput="updateTurnoRow('${t.id}',{personasSemana:this.value})" style="flex:1; min-width:50px; padding:8px 10px;" placeholder="1"/>
        <input id="turno-finde-${t.id}" type="text" inputmode="numeric" value="${t.personasFinde}" oninput="updateTurnoRow('${t.id}',{personasFinde:this.value})" style="flex:1; min-width:50px; padding:8px 10px;" placeholder="1"/>
        <button onclick="removeTurnoRow('${t.id}')" style="color:var(--coral); font-weight:800; padding:6px 8px;">✕</button>
      </div>`).join("")}
      <button class="btn btn-ghost" style="border:1.5px dashed var(--mint-dim); border-radius:10px; width:100%; padding:10px; font-size:12.5px;" onclick="addTurnoRow()">+ Agregar turno manual</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" onclick="cancelAddLocal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveNewLocal()">${state.empresaId? 'Crear sucursal':'Agregar a la lista'}</button>

}
function renderReportes(){
  const rows = state.employees.map(e=>{
    const planificado = statsFor(e.id).horas;
    const { workedH, restH } = computeWorkedMs(e.id);
    const diff = Math.round((workedH-planificado)*10)/10;
    const irregular = Math.abs(diff) >= 1;
    return `<tr>
      <td style="text-align:left; font-weight:700;">${e.name}</td>
      <td class="mono" style="text-align:center;">${planificado}h</td>
      <td class="mono" style="text-align:center;">${workedH}h</td>
      <td class="mono" style="text-align:center;">${restH}h</td>
      <td style="text-align:center;">${irregular ? `<span class="badge badge-pendiente">${diff>0?'+':''}${diff}h</span>` : `<span class="badge badge-aprobado">OK</span>`}</td>
    </tr>`;
  }).join("");
  return `<div class="card" style="margin-top:18px;">
    <h3 style="margin:0 0 4px; font-size:15px;">⏱ Reportes — esta semana</h3>
    <p class="sub" style="margin-bottom:14px;">Planificado (según el calendario) vs. realmente fichado. Se arma solo con cada marca de estado.</p>
    <div style="overflow-x:auto;"><table style="min-width:480px;">
      <thead><tr><th style="text-align:left;">Empleado</th><th>Planificado</th><th>Fichado</th><th>Descanso</th><th>Diferencia</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function renderDashboard(){
  const activeLocal = state.locales.find(l=>l.id===state.activeLocalId) || state.locales[0];
  const r = rulesForConfig(activeLocal ? activeLocal.config : null);
  let totalAlerts = 0;
  const alertLines = [];
  state.employees.forEach(e=>{
    const s = statsFor(e.id);
    totalAlerts += s.violations.length;
    s.violations.forEach(v=> alertLines.push(`<div class="alert-line">⚠️ <b>${e.name}</b> ${v}.</div>`));
  });
  const rowsHtml = state.employees.map(e=>{
    const cells = DAYS.map((_,d)=>`<td>${renderCellSelect(e.id,d)}</td>`).join("");
    return `<tr><td><div class="emp-cell-name">${e.name}</div><div class="emp-cell-role">${e.role}</div></td>${cells}</tr>`;
  }).join("");
  const calendario = `<div class="card" style="box-shadow:0 30px 70px -20px rgba(0,0,0,0.65);">
    <h2 class="display" style="margin:0 0 3px; font-size:21px;">📅 Horario de la semana</h2>
    <p class="sub" style="margin-bottom:6px;">Quién trabaja, cuándo, y en qué sucursal — ${activeLocal?activeLocal.nombre:'sin sucursal'} y el resto del equipo.</p>
    ${renderCalendarControls()}
    <div style="overflow-x:auto; border:1px solid var(--mint-dim); border-radius:var(--radius-sm);"><table style="min-width:640px;">
      <thead><tr><th>Empleado</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody>
    </table></div>
    <div class="legend" style="padding-left:0; padding-right:0;"><span><span class="legend-swatch" style="background:rgba(188,237,7,0.35); border:1px solid var(--lime-dim);"></span>Turno asignado</span><span><span class="legend-swatch" style="background:transparent; border:1px dashed var(--forest);"></span>Libre</span><span>Cada celda elige sucursal + turno</span></div>
  </div>`;
  const reportes = renderReportes();
  const alertBlock = totalAlerts>0 ? `<div class="alert-card" style="margin-top:18px;"><b style="display:block;margin-bottom:6px;">🚨 Alertas</b>${alertLines.join("")}</div>` : `<div class="card" style="margin-top:18px; box-shadow:none; border:1.5px dashed var(--mint-dim); text-align:center; color:var(--forest); font-weight:700; font-size:13.5px;">✅ Sin alertas esta semana</div>`;
  const estado = `<div class="side-card"><div class="side-title">Estado del equipo — solo lectura, lo marca cada uno</div>
    ${state.employees.map(e=>{ const m = statusMeta(e.id);
      return `<div class="status-item"><span class="status-name"><span class="status-dot" style="background:${m.color}; ${m.outline?'border:1.5px dashed var(--text-dark-sec); background:transparent;':''} opacity:${m.dim?0.5:1};"></span>${e.name}</span><span class="status-label mono" style="color:${m.outline?'var(--text-dark-sec)':m.color}">${m.text}</span></div>`;
    }).join("")}
  </div>`;
  const pendientes = state.ausenciasPendientes.length ? `<div class="accordion-card" style="padding-bottom:16px;"><h3>Faltas y certificados pendientes</h3>
    ${state.ausenciasPendientes.map(a=>`<div class="pending-card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div><b>${a.empleadoNombre}</b> · ${a.fecha}<div style="font-size:12.5px; color:var(--text-light-sec); margin-top:4px;">${a.motivo||'Sin motivo detallado'}</div></div>
        <span class="badge badge-pendiente">Pendiente</span>
      </div>
      ${a.certificado_b64 ? `<img class="pending-thumb" src="${a.certificado_b64}" />` : ""}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-primary" style="padding:9px 16px; font-size:12.5px;" onclick="reviewAusencia('${a.id}','aprobado')">Aprobar</button>
        <button class="btn btn-ghost" style="padding:9px 16px; font-size:12.5px; border:1.5px solid var(--mint-dim); border-radius:999px;" onclick="reviewAusencia('${a.id}','rechazado')">Rechazar</button>
      </div>
    </div>`).join("")}
  </div>` : "";
  const statMini = `<div class="stat-grid" style="margin-top:18px;">
    <div class="stat-card" style="box-shadow:none; border:1.5px solid var(--mint-dim); padding:14px;"><div class="stat-label" style="margin-bottom:4px;">🏪 ${activeLocal?activeLocal.nombre:'—'}</div><div style="font-size:13px; color:var(--text-light-sec);">${r.label} · descanso ${r.descanso}h · máx ${r.maxHoras}h</div></div>
    <div class="stat-card" style="box-shadow:none; border:1.5px solid var(--mint-dim); padding:14px;"><div class="stat-label" style="margin-bottom:4px;">👥 Equipo</div><div style="font-size:13px; color:var(--text-light-sec);">${state.employees.length} personas · ${state.locales.length} sucursal${state.locales.length===1?'':'es'}</div></div>
  </div>`;
  return `${renderLocalTabs()}${renderNewLocalForm()}${calendario}${reportes}${alertBlock}
    <div class="dash-grid" style="margin-top:18px;">${estado}${pendientes}</div>
    ${statMini}
    <div class="footer-note">Conectado a tu base de datos. Prototipo ilustrativo — no reemplaza asesoramiento legal o contable.</div>`;
}

/* ---- Empleado ---- */
function renderEmployeeNotReady(){
  return `<div class="wizard-wrap"><div class="card" style="text-align:center;"><h2 class="title display">Necesitás el link de tu encargado</h2><p class="sub">Pedile el link de este negocio a tu encargado y abrilo — desde ahí vas a poder sumarte tocando "Equipo".</p></div></div>`;
}
function renderEmployeeJoin(){
  return `<div class="wizard-wrap"><div class="card"><h2 class="title display">Sumate al equipo</h2><p class="sub">Ingresá tu nombre para unirte a <b>${state.empresaName}</b>.</p>
    <input type="text" id="joinName" placeholder="Tu nombre" style="margin-bottom:14px;" onkeydown="if(event.key==='Enter')joinTeam()"/>
    <button class="btn btn-primary btn-block" onclick="joinTeam()">Unirme</button>
  </div></div>`;
}
async function joinTeam(){
  const input = document.getElementById("joinName");
  const name = input.value.trim();
  if(!name || !state.empresaId) return;
  let found = state.employees.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!found){
    const { data, error } = await sb.from("empleados").insert({ empresa_id:state.empresaId, nombre:name, rol:"Sin definir", estado:"afuera" }).select().single();
    if(error){ state.error="No se pudo sumar."; render(); return; }
    found = {id:data.id, name:data.nombre, role:data.rol};
    state.employees.push(found);
    state.turnos[found.id]=Array(7).fill(null);
    state.clockStatus[found.id]="afuera";
    state.statusHistory[found.id]=[];
  }
  state.employeeSession = found.id;
  render();
  loadMisAusencias(found.id);
}
function renderStatusFlow(empId){
  const flow = todayFlowState(empId);
  if(flow.fase==="sin_marcar"){
    if(state.confirmando==="entrada"){
      return `<div class="new-local-form" style="text-align:center;">
        <p style="margin:0 0 14px; font-weight:700;">¿Confirmás que estás entrando ahora?</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn btn-ghost" onclick="cancelarConfirmacion()">Cancelar</button>
          <button class="btn btn-primary" onclick="confirmarMarca('${empId}','local')">Sí, marcar entrada</button>
        </div>
      </div>`;
    }
    return `<button class="btn btn-primary btn-block" onclick="pedirConfirmacion('entrada')">▶️ Marcar entrada</button>`;
  }
  if(flow.fase==="trabajando"){
    if(state.confirmando==="salida"){
      return `<div class="new-local-form" style="text-align:center;">
        <p style="margin:0 0 14px; font-weight:700;">¿Confirmás tu salida? No vas a poder editarlo después.</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn btn-ghost" onclick="cancelarConfirmacion()">Cancelar</button>
          <button class="btn btn-primary" onclick="confirmarMarca('${empId}','afuera')">Sí, marcar salida</button>
        </div>
      </div>`;
    }
    return `<div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="status-btn" onclick="setStatus('${empId}','descanso')">☕ Iniciar mi descanso</button>
      <button class="status-btn" onclick="pedirConfirmacion('salida')">⏹ Marcar salida</button>
    </div>`;
  }
  if(flow.fase==="en_descanso"){
    return `<button class="btn btn-primary btn-block" onclick="setStatus('${empId}','local')">▶️ Volver del descanso</button>`;
  }
  if(flow.fase==="finalizado"){
    return `<div class="libre-banner" style="background:rgba(188,237,7,0.15); border-color:var(--lime-dim); color:var(--forest);">✅ Marcaste tu salida hoy a las ${fmtTime(flow.hora)}. Quedó registrado — no se puede editar.</div>`;
  }
  return "";
}
function renderEmployeeDashboard(){
  const me = state.employees.find(e=>e.id===state.employeeSession);
  if(!me){ state.employeeSession=null; return renderEmployeeJoin(); }
  const s = statsFor(me.id);
  const todayEntry = (state.turnos[me.id]||[])[todayIndex()];
  const isLibreToday = todayEntry && todayEntry.tipo==="franco";
  const todayLocal = todayEntry && todayEntry.localId ? localName(todayEntry.localId) : null;
  const st = state.clockStatus[me.id]||"afuera";
  const todayTurnoNombre = todayEntry && todayEntry.tipo!=="franco" ? ((findTurno(todayEntry.localId, todayEntry.tipo)||{}).nombre) : null;
  const strip = DAYS.map((d,i)=>{
    const v = (state.turnos[me.id]||[])[i];
    const isToday = i===todayIndex();
    const lbl = !v ? "—" : v.tipo==="franco" ? "Libre" : ((findTurno(v.localId,v.tipo)||{}).nombre||"Turno").slice(0,6);
    return `<div class="strip-pill mono ${cellDisplayClass(v)}" style="${isToday?'box-shadow:0 0 0 2px var(--ink);':''}"><span class="strip-day">${d}${isToday?' •':''}</span>${lbl}</div>`;
  }).join("");
  const statusBlock = isLibreToday
    ? `<div class="libre-banner">🎉 Hoy es tu día libre. ¡Disfrutalo!</div>`
    : `<div><div class="field-label" style="margin-bottom:8px;">${todayLocal?'Hoy en '+todayLocal+(todayTurnoNombre?' · '+todayTurnoNombre:''):''}</div>${renderStatusFlow(me.id)}</div>`;
  const faltaSection = state.reportandoFalta ? `<div class="new-local-form">
      <div class="field-label">Fecha</div>
      <input id="inp-fecha" type="date" value="${state.nuevaAusencia.fecha}" oninput="updateNuevaAusencia({fecha:this.value})" style="margin-bottom:12px;" />
      <div class="field-label">Motivo</div>
      <textarea id="inp-motivo" placeholder="Ej: consulta médica" oninput="updateNuevaAusencia({motivo:this.value})" style="min-height:70px; margin-bottom:12px;">${state.nuevaAusencia.motivo}</textarea>
      <div class="field-label">Certificado (opcional)</div>
      <input type="file" accept="image/*" onchange="handleCertificadoFile(this)" style="margin-bottom:12px;" />
      ${state.nuevaAusencia.certificado_b64 ? `<img class="pending-thumb" src="${state.nuevaAusencia.certificado_b64}"/>` : ""}
      <div style="display:flex; gap:10px; margin-top:8px;"><button class="btn btn-ghost" onclick="cancelReportarFalta()">Cancelar</button><button class="btn btn-primary" onclick="submitAusencia()">Enviar</button></div>
    </div>`
    : `<button class="btn btn-ghost" style="border:1.5px dashed var(--mint-dim); border-radius:12px; margin-top:14px; width:100%; padding:14px;" onclick="startReportarFalta()">+ Reportar una falta</button>`;
  const misAusenciasHtml = (state.misAusencias||[]).length ? `<div style="margin-top:16px;">
    <div class="field-label" style="margin-bottom:8px;">Tus faltas reportadas</div>
    ${state.misAusencias.map(a=>`<div class="pending-card" style="display:flex; justify-content:space-between; align-items:center;"><span style="font-size:12.5px;">${a.fecha} · ${a.motivo||'Sin motivo'}</span><span class="badge badge-${a.estado_revision}">${a.estado_revision}</span></div>`).join("")}
  </div>` : "";
  return `<div class="wizard-wrap"><div class="card">
    <div class="greet display">Hola, ${me.name} 👋</div><p class="sub" style="margin-top:2px;">${state.empresaName}</p>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr; margin-bottom:6px;">
      <div class="stat-card" style="box-shadow:none;border:1.5px solid var(--mint-dim);"><div class="stat-label">⏱ Esta semana</div><div class="stat-value display">${s.horas}h ${s.r.maxHoras?'/ '+s.r.maxHoras+'h':''}</div><div class="stat-sub">Horas trabajadas</div></div>
      <div class="stat-card" style="box-shadow:none;border:1.5px solid var(--mint-dim);"><div class="stat-label">🌿 Tu descanso</div><div class="stat-value display ${s.hasFranco?'tone-lime':'tone-coral'}">${s.hasFranco? DAYS[s.francoIdx] : 'Pendiente'}</div><div class="stat-sub">${s.hasFranco?'Día libre asignado':'Todavía no tenés franco esta semana'}</div></div>
    </div>
    <div class="week-strip">${strip}</div>
    <div style="margin-top:18px;">${statusBlock}</div>
    ${faltaSection}
    ${misAusenciasHtml}
    <button class="link-quiet" onclick="state.employeeSession=null; render();" style="border:none;background:none;cursor:pointer;">No soy ${me.name} — cambiar de persona</button>
  </div></div>`;
}

loadState();
</script>
